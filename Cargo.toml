[package]
name = "devbox"
version = "0.2.2"
edition = "2024"
# Edition 2024 needs 1.85 and let-chains need 1.88; `File::try_lock`, which is
# how two devbox processes agree on who is rebuilding a box, needs 1.89. Both
# floors were verified by installing the toolchain and building, not inferred
# from release notes — and CI builds against this one, so the number cannot
# drift away from the truth the way the 1.85 claim did.
rust-version = "1.89"
description = "Isolated developer VMs for AI coding agents and humans. Safe by default."
license = "Apache-2.0"
repository = "https://github.com/ethannortharc/devbox"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization / Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
colored = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
dirs = "6"
# Only for process-group control in `mcp::shim`. Signalling a process *group*
# has no safe shell equivalent: `kill(1)` differs between procps, util-linux
# and BSD, needs a PATH lookup on the shutdown path, and puts a whole
# subprocess spawn between deciding to signal and signalling — which is the
# window a recycled pid needs. `killpg(2)` and `getpgrp(2)` are two calls.
libc = "0.2"
which = "7"
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws", "macros"] }
askama = "0.16.0"
rust-embed = "8.12.0"
mime_guess = "2.0.5"
futures = "0.3.33"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rand = "0.10.2"
sha2 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
form_urlencoded = "1.2.2"
rusqlite = { version = "0.37", features = ["bundled"] }
# The broker's upstream client. `rustls-tls` keeps the TLS stack in-process
# rather than depending on whatever the host's OpenSSL happens to be, and
# `stream` is what makes an SSE response forwardable instead of buffered.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
bytes = "1"
tempfile = "3"

[dev-dependencies]
# `start_paused`, which is not in tokio's `full`. It is what turns the
# keepalive-cancels-the-reader bug from a heisenbug that four people saw once
# each into a test with an exact ordering.
tokio = { version = "1", features = ["full", "test-util"] }
futures = "0.3.33"
http-body-util = "0.1.4"
serde_json = "1"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
