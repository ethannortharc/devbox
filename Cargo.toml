[package]
name = "devbox"
version = "0.1.3"
edition = "2024"
# Edition 2024 needs 1.85, but let-chains — used in fourteen places — were not
# stable until 1.88, so a 1.85 toolchain failed to compile this before running
# a single test. The docs said 1.85 and nothing checked them; cargo checks this
# one, and CI builds against it.
rust-version = "1.88"
description = "Isolated developer VMs for AI coding agents and humans. Safe by default."
license = "Apache-2.0"
repository = "https://github.com/ethannortharc/devbox"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization / Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
colored = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
dirs = "6"
which = "7"
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws", "macros"] }
askama = "0.16.0"
rust-embed = "8.12.0"
mime_guess = "2.0.5"
futures = "0.3.33"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rand = "0.10.2"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
form_urlencoded = "1.2.2"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
futures = "0.3.33"
http-body-util = "0.1.4"
serde_json = "1"
tempfile = "3"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
