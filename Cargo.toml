[package]
name = "devbox"
version = "0.1.3"
edition = "2024"
description = "Isolated developer VMs for AI coding agents and humans. Safe by default."
license = "Apache-2.0"
repository = "https://github.com/ethannortharc/devbox"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization / Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# UX
indicatif = "0.17"
colored = "2"
dialoguer = "0.11"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
dirs = "6"
which = "7"
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws", "macros"] }
askama = "0.16.0"
rust-embed = "8.12.0"
mime_guess = "2.0.5"
futures = "0.3.33"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rand = "0.10.2"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }

[dev-dependencies]
futures = "0.3.33"
http-body-util = "0.1.4"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
