# The zero-touch-provisioning flagship (§10).
#
# `svc` runs DHCP (options 66/67), DNS, NTP, and the ZTP server. The three
# `ztp-blank` nodes boot with no configuration at all — pre-configuring them
# would make the whole demonstration a lie — discover the boot server over
# DHCP, identify themselves, fetch a rendered config, apply it, and converge.

[lab]
name = "ztp-fabric"
substrate = "auto"

[[nodes]]
name = "svc"
role = "service"
sets = ["network"]

[[nodes]]
name = "spine1"
role = "frr-router"
sets = ["network"]

[[nodes]]
name = "leaf1"
role = "ztp-blank"

[[nodes]]
name = "leaf2"
role = "ztp-blank"

[[nodes]]
name = "leaf3"
role = "ztp-blank"

[[links]]
endpoints = ["svc:eth1", "spine1:eth1"]

[[links]]
endpoints = ["leaf1:eth1", "spine1:eth2"]
subnet = "10.0.2.0/30"

[[links]]
endpoints = ["leaf2:eth1", "spine1:eth3"]
subnet = "10.0.3.0/30"

[[links]]
endpoints = ["leaf3:eth1", "spine1:eth4"]
subnet = "10.0.4.0/30"

[services]
dns = true
dhcp = true
ntp = true
