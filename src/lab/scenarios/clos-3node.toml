# The smallest fabric that is still a fabric.
#
# Two leaves and one spine, each router its own AS, peering unnumbered over the
# link interfaces. Bringing this up and running the reachability matrix is the
# fastest way to confirm the lab plumbing works end to end.

[lab]
name = "clos-3node"
substrate = "auto"

[[nodes]]
name = "leaf1"
role = "frr-router"
sets = ["network"]

[[nodes]]
name = "leaf2"
role = "frr-router"
sets = ["network"]

[[nodes]]
name = "spine1"
role = "frr-router"
sets = ["network"]

[[links]]
endpoints = ["leaf1:eth1", "spine1:eth1"]
subnet = "10.0.12.0/31"

[[links]]
endpoints = ["leaf2:eth1", "spine1:eth2"]
subnet = "10.0.22.0/31"

[services]
dns = true
dhcp = false
ntp = true
