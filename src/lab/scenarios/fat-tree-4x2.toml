# Two-tier fat-tree: four leaves, two spines, every leaf dual-homed.
#
# The dual-homing is the point. With two equal-cost paths to every destination,
# a single lossy link degrades one path rather than everything — which is what
# makes a straggler look like a straggler instead of a uniform slowdown (§9.5).

[lab]
name = "fat-tree-4x2"
substrate = "auto"

[[nodes]]
name = "leaf1"
role = "frr-router"
sets = ["network"]

[[nodes]]
name = "leaf2"
role = "frr-router"
sets = ["network"]

[[nodes]]
name = "leaf3"
role = "frr-router"
sets = ["network"]

[[nodes]]
name = "leaf4"
role = "frr-router"
sets = ["network"]

[[nodes]]
name = "spine1"
role = "frr-router"
sets = ["network"]

[[nodes]]
name = "spine2"
role = "frr-router"
sets = ["network"]

[[links]]
endpoints = ["leaf1:eth1", "spine1:eth1"]

[[links]]
endpoints = ["leaf1:eth2", "spine2:eth1"]

[[links]]
endpoints = ["leaf2:eth1", "spine1:eth2"]

[[links]]
endpoints = ["leaf2:eth2", "spine2:eth2"]

[[links]]
endpoints = ["leaf3:eth1", "spine1:eth3"]

[[links]]
endpoints = ["leaf3:eth2", "spine2:eth3"]

[[links]]
endpoints = ["leaf4:eth1", "spine1:eth4"]

[[links]]
endpoints = ["leaf4:eth2", "spine2:eth4"]

[services]
dns = true
ntp = true
