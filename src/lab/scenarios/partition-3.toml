# Three routers in a triangle.
#
# A triangle rather than a chain: cutting one link leaves a path, so
# reconvergence is observable; cutting two isolates a node, so a real partition
# is one command away.

[lab]
name = "partition-3"
substrate = "auto"

[[nodes]]
name = "node1"
role = "frr-router"
sets = ["network"]

[[nodes]]
name = "node2"
role = "frr-router"
sets = ["network"]

[[nodes]]
name = "node3"
role = "frr-router"
sets = ["network"]

[[links]]
endpoints = ["node1:eth1", "node2:eth1"]

[[links]]
endpoints = ["node2:eth2", "node3:eth1"]

[[links]]
endpoints = ["node3:eth2", "node1:eth2"]

[services]
dns = true
ntp = true
