# The shape every egress question has.
#
# A client with no route to the server, a proxy that can reach both, and a
# router in the middle so the path is real rather than a host-route trick. Set
# the client's posture to `allowlist` and watch what it can and cannot do.

[lab]
name = "client-proxy-server"
substrate = "auto"

[[nodes]]
name = "client"
role = "host"

[[nodes]]
name = "proxy"
role = "frr-router"
sets = ["network"]

[[nodes]]
name = "server"
role = "host"

[[links]]
endpoints = ["client:eth1", "proxy:eth1"]

[[links]]
endpoints = ["proxy:eth2", "server:eth1"]

[services]
dns = true
ntp = true
