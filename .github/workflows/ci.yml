name: CI

on:
  pull_request:
  push:
    branches: [v4]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

  # The declared MSRV, actually built.
  #
  # `rust-version` in Cargo.toml makes cargo refuse an older toolchain with a
  # clear message, but it does not stop the floor drifting: nothing noticed
  # when let-chains raised the real minimum to 1.88 while README and
  # CONTRIBUTING went on promising 1.85, because every build here ran on
  # stable. This job is what turns that promise into something checked.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: Swatinem/rust-cache@v2

      - name: cargo check on the declared minimum
        run: cargo check --all-targets

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l agent ztpd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for: $unformatted"
            exit 1
          fi

      # The eBPF programs need a kernel with BTF to *load*, but the decode and
      # transport layers are tested against recorded fixtures and need no
      # privileges — so this lane stays fast and hermetic. Kernel-load tests
      # live in the `ebpf` job below.
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labkit
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: install
        run: uv sync --all-extras --dev

      - name: ruff
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy .

      - name: pytest
        run: uv run pytest -q

  ebpf:
    name: eBPF (privileged Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check kernel BTF
        run: |
          if [ -r /sys/kernel/btf/vmlinux ]; then
            echo "BTF available: $(uname -r)"
          else
            echo "::error::kernel has no BTF; the real loader cannot be verified"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: install clang/llvm and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y bpftool clang llvm libbpf-dev

      - name: generate vmlinux types
        run: sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c > agent/bpf/vmlinux.h

      - name: build eBPF objects
        run: |
          # Keep whatever this checkout committed: `go generate` overwrites it,
          # and the next step's whole job is to compare the two.
          for tracked in agent/bpf/devbox_amd64_bpfel.go agent/bpf/devbox_amd64_bpfel.o; do
            if [ -f "$tracked" ]; then cp "$tracked" "$tracked.committed"; fi
          done
          go generate -tags bpf2go ./agent/bpf

      # The object is tracked per architecture so a source build embeds the
      # eBPF agent (agent/bpf/README.md). Tracked generated output goes stale
      # silently, and the symptom is not a build failure: it is an agent whose
      # probes disagree with `devbox.bpf.c` and decode into plausible garbage.
      - name: check the committed amd64 object is current
        id: core-object
        run: |
          uncommitted=
          for tracked in agent/bpf/devbox_amd64_bpfel.go agent/bpf/devbox_amd64_bpfel.o; do
            if [ ! -f "$tracked.committed" ]; then
              uncommitted="$uncommitted $tracked"
              continue
            fi
            if ! cmp -s "$tracked" "$tracked.committed"; then
              echo "::error file=$tracked::$tracked is not what this source generates."
              echo "Regenerate on an amd64 Linux host with BTF and commit the result:"
              echo "  bpftool btf dump file /sys/kernel/btf/vmlinux format c > agent/bpf/vmlinux.h"
              echo "  go generate -tags bpf2go ./agent/bpf"
              echo "A clang or kernel-BTF change on this runner is a legitimate"
              echo "cause, and the fix is the same: regenerate and commit."
              exit 1
            fi
          done
          rm -f agent/bpf/devbox_amd64_bpfel.go.committed agent/bpf/devbox_amd64_bpfel.o.committed
          if [ -n "$uncommitted" ]; then
            echo "::notice::no committed amd64 object yet ($uncommitted); uploading the generated pair to commit"
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.core-object.outputs.upload == 'true'
        with:
          name: devbox-bpf-amd64
          path: |
            agent/bpf/devbox_amd64_bpfel.go
            agent/bpf/devbox_amd64_bpfel.o
          retention-days: 7

      - name: load probes and capture a scripted workload
        run: |
          sudo -E env "PATH=$PATH" go test -tags=ebpf \
            ./agent/bpf ./agent/capture ./agent/cmd/obsd

  lab-e2e:
    name: Routed + ZTP labs (privileged Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: Swatinem/rust-cache@v2

      - name: wire namespaces, converge BGP, and test the reachability matrix
        run: cargo test --test e2e_lab -- --nocapture

      - name: DHCP boot blank nodes and converge the ZTP fabric
        run: cargo test --test e2e_ztp -- --nocapture
