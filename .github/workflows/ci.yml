name: CI

on:
  pull_request:
  push:
    branches: [main, v4, v5-main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

  # The declared MSRV, actually built.
  #
  # `rust-version` in Cargo.toml makes cargo refuse an older toolchain with a
  # clear message, but it does not stop the floor drifting: nothing noticed
  # when let-chains raised the real minimum to 1.88 while README and
  # CONTRIBUTING went on promising 1.85, because every build here ran on
  # stable. This job is what turns that promise into something checked.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: Swatinem/rust-cache@v2

      - name: cargo check on the declared minimum
        run: cargo check --all-targets

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l agent internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for: $unformatted"
            exit 1
          fi

      # The eBPF programs need a kernel with BTF to *load*, but the decode and
      # transport layers are tested against recorded fixtures and need no
      # privileges — so this lane stays fast and hermetic. Kernel-load tests
      # live in the `ebpf` job below.
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  ebpf:
    name: eBPF (privileged Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check kernel BTF
        run: |
          if [ -r /sys/kernel/btf/vmlinux ]; then
            echo "BTF available: $(uname -r)"
          else
            echo "::error::kernel has no BTF; the real loader cannot be verified"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: install clang/llvm and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-tools-common
          # On Ubuntu 24.04 `bpftool` is a virtual package: the binary ships in
          # the kernel-specific linux-tools package, so ask for the running
          # kernel's and fall back to the generic one.
          sudo apt-get install -y "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-generic
          bpftool version

      - name: generate vmlinux types
        run: sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c > agent/bpf/vmlinux.h

      - name: build eBPF objects
        run: |
          # Keep the committed bindings: `go generate` overwrites them, and the
          # next step's whole job is to compare the two.
          if [ -f agent/bpf/devbox_amd64_bpfel.go ]; then
            cp agent/bpf/devbox_amd64_bpfel.go agent/bpf/devbox_amd64_bpfel.go.committed
          fi
          go generate -tags bpf2go ./agent/bpf

      # bpf2go writes a pair, and only one half of it can be gated here.
      #
      # The .go bindings name the loader's API surface — programs, maps, record
      # types — so they move only when `devbox.bpf.c` moves. A difference is a
      # real staleness signal and nothing else produces one.
      #
      # The .o cannot be byte-compared. It embeds BTF taken from this runner's
      # own kernel, so a clang upgrade or a runner image bump rewrites its bytes
      # while the source stands still; gating on that turns the build red for
      # something no commit caused. It is uploaded instead, every run, for a
      # maintainer to commit when the source behind it changed.
      #
      # What that leaves uncovered is named in agent/bpf/README.md: editing a
      # probe body without touching a name changes the object and not the
      # bindings, and no CI check can see it.
      - name: check the committed amd64 bindings are current
        run: |
          if [ ! -f agent/bpf/devbox_amd64_bpfel.go.committed ]; then
            echo "::notice::no committed amd64 pair yet; download devbox-bpf-amd64 from this run and commit both files"
            exit 0
          fi
          if ! cmp -s agent/bpf/devbox_amd64_bpfel.go agent/bpf/devbox_amd64_bpfel.go.committed; then
            echo "::error file=agent/bpf/devbox_amd64_bpfel.go::the committed amd64 bindings are not what this source generates."
            echo "Download the devbox-bpf-amd64 artifact from this run and commit both files."
            diff -u agent/bpf/devbox_amd64_bpfel.go.committed \
                    agent/bpf/devbox_amd64_bpfel.go || true
            exit 1
          fi
          rm -f agent/bpf/devbox_amd64_bpfel.go.committed

      # Uploaded on failure too: a failing bindings check is exactly when the
      # generated pair is the thing you came for.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: devbox-bpf-amd64
          path: |
            agent/bpf/devbox_amd64_bpfel.go
            agent/bpf/devbox_amd64_bpfel.o
          retention-days: 14

      - name: load probes and capture a scripted workload
        run: |
          sudo -E env "PATH=$PATH" go test -tags=ebpf \
            ./agent/bpf ./agent/capture ./agent/cmd/obsd
