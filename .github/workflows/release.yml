name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  agent:
    name: Agent linux/${{ matrix.goarch }}
    # bpf2go compiles kprobe register access against the build host's BTF.
    # Cross-compiling an arm64 object on an x86 runner therefore produces an
    # invalid (and normally uncompilable) probe. Keep GOARCH and the runner's
    # kernel architecture aligned.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
            artifact: devbox-obsd-linux-amd64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            artifact: devbox-obsd-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          # Ubuntu's bpftool comes from kernel-specific linux-tools packages
          # that do not exist for the runners' Azure kernels. libbpf publishes
          # static builds per architecture; use one of those.
          BPFTOOL_VERSION=v7.7.0
          curl -fsSL -o /tmp/bpftool.tar.gz \
            "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-${{ matrix.goarch }}.tar.gz"
          tar -xzf /tmp/bpftool.tar.gz -C /tmp bpftool
          sudo install -m 0755 /tmp/bpftool /usr/local/bin/bpftool
          BPFTOOL=/usr/local/bin/bpftool
          "$BPFTOOL" version
          echo "BPFTOOL=$BPFTOOL" >> "$GITHUB_ENV"

      - name: Generate CO-RE types and object
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          sudo "$BPFTOOL" btf dump file /sys/kernel/btf/vmlinux format c > agent/bpf/vmlinux.h
          go generate -tags bpf2go ./agent/bpf

      - name: Build version-pinned agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo version $package_version"
            exit 1
          fi
          go build -trimpath -tags ebpf \
            -ldflags "-s -w -X github.com/ethannortharc/devbox/internal/buildinfo.Version=$package_version -X github.com/ethannortharc/devbox/internal/buildinfo.Commit=${GITHUB_SHA::12}" \
            -o ${{ matrix.artifact }} ./agent/cmd/obsd

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: agent
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: devbox-darwin-arm64
            agent_name: devbox-obsd-linux-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: devbox-linux-amd64
            agent_name: devbox-obsd-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.agent_name }}
          path: embedded-agent

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        env:
          DEVBOX_OBSD_BINARY: ${{ github.workspace }}/embedded-agent/${{ matrix.agent_name }}
          DEVBOX_OBSD_EBPF: "1"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (macOS)
        if: matrix.os == 'macos-latest'
        run: strip target/${{ matrix.target }}/release/devbox

      - name: Strip binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: strip target/${{ matrix.target }}/release/devbox

      - name: Rename binary
        run: mv target/${{ matrix.target }}/release/devbox ${{ matrix.binary_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            devbox-darwin-arm64
            devbox-linux-amd64
